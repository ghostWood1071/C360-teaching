coordinator=true
node-scheduler.include-coordinator=true
http-server.http.enabled=true
http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/certs/trino.jks
http-server.https.keystore.key=${ENV:TRINO_KEYSTORE_PASSWORD}
http-server.authentication.type=PASSWORD
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
discovery.uri=http://trino:8080
query.max-memory=${ENV:TRINO_QUERY_MAX_MEMORY}
query.max-total-memory=${ENV:TRINO_QUERY_MAX_TOTAL_MEMORY}
query.max-run-time=${ENV:TRINO_QUERY_MAX_RUN_TIME}
query.max-execution-time=${ENV:TRINO_QUERY_MAX_RUN_TIME}
query.client.timeout=2m
query.min-expire-age=5m
http-server.process-forwarded=true
