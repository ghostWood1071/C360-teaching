services:
  spark-master:
    image: ${SPARK_IMAGE}
    profiles: [distributed]
    command: ["/opt/spark/sbin/start-master.sh"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${HOST_BIND:-127.0.0.1}:18081:8080"
    networks: [customer360]
    mem_limit: 768m

  spark-worker-1:
    image: ${SPARK_IMAGE}
    profiles: [distributed]
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 1536m
    depends_on: [spark-master]
    networks: [customer360]
    mem_limit: 2g

  spark-worker-2:
    image: ${SPARK_IMAGE}
    profiles: [distributed]
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 1536m
    depends_on: [spark-master]
    networks: [customer360]
    mem_limit: 2g
