profile: small
seed: 42
reference_time: '2027-01-01T00:00:00Z'
generation:
  batch_size: 5000
  row_group_size: 1000
  compression: snappy
volume:
  customers: 10000
  accounts: 20000
  transactions: 40000
  customer_profiles: 10000
  loans: 10000
distribution:
  corporate_customer_ratio: 0.05
  inactive_customer_ratio: 0.15
  never_transacted_customer_ratio: 0.1
descriptive_columns:
  description: 192
  merchant_name: 64
simulation:
  skew:
    enabled: true
    hot_accounts:
    - account_id: 1
      transaction_count: 12000
    - account_id: 2
      transaction_count: 4000
    - account_id: 3
      transaction_count: 2000
  join_explosion:
    enabled: true
    customer_count: 10
    accounts_per_customer: 5
    transactions_per_account: 100
    loans_per_customer: 10
  broadcast_join:
    enabled: true
    overdue_loan_ratio: 0.01
  data_quality:
    enabled: true
    duplicate_transaction_ratio: 0.01
    missing_income_ratio: 0.05
    inconsistent_phone_ratio: 0.1
    missing_profile_ratio: 0.0
    repeated_delivery_events: 0
  transaction_history:
    months: 12
  incremental:
    enabled: true
    new_customers: 20
    new_customer_profiles: 20
    new_accounts: 40
    updated_accounts: 200
    new_transactions: 1000
    updated_transactions: 20
    updated_customer_profiles: 100
    new_loans: 20
    updated_loans: 100
    late_arriving_transactions: 0
    protect_reserved: true
output:
  base_path: ./data/small
  format: parquet
  transaction_file_count: 8
  rows_per_file: null
  generate_month_partitioned_variant: true
  generate_pushdown_variant: true
  generate_uniform_baseline: true
